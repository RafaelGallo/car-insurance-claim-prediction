[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "car_insurance_claim"
version = "0.1.0"
description = "Car Insurance Claim Risk Prediction - MLOps stack (Streamlit, MLflow, Airflow, Docker)"
authors = [
  { name = "rafaelgallo" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = ">=3.10"

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.isort]
profile = "black"
known_first_party = ["car_insurance_claim"]
force_sort_within_sections = true


